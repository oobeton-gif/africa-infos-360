{% extends "base.html" %}{% block content %}<section class="staticpage"><h1>{{'Modifier' if article else 'Nouvel article'}}</h1><form method="post" class="contactform"><label>Titre<input name="title" required value="{{article.title if article else ''}}"></label><label>Adresse courte (slug)<input name="slug" required value="{{article.slug if article else ''}}" placeholder="mon-article"></label><label>Catégorie<select name="category">{% for c in categories %}<option {% if article and article.category==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select></label><label>Résumé<input name="excerpt" required value="{{article.excerpt if article else ''}}"></label><label>URL de l'image (facultatif)<input name="image_url" value="{{article.image_url if article else ''}}"></label><label>Contenu<textarea name="body" rows="14" required>{{article.body if article else ''}}</textarea></label><label class="check"><input type="checkbox" name="published" {% if not article or article.published %}checked{% endif %}> Publier immédiatement</label><button class="btn">Enregistrer l'article</button></form></section>{% endblock %}
